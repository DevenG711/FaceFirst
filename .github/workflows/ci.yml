name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety-and-tests:
    name: Safety lint + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Safety lint (banned words, 911 button, .kiro not ignored)
        run: node scripts/safety-lint.mjs

      - name: Check .kiro is committed
        run: test -d .kiro/steering && test -d .kiro/specs && test -d .kiro/hooks

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Property-based + unit tests
        if: hashFiles('package-lock.json') != ''
        run: npx vitest --run

  kiro-safety-review:
    name: Kiro CLI safety review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if no KIRO_API_KEY secret
        if: env.KIRO_API_KEY == ''
        run: echo "KIRO_API_KEY secret not set; skipping Kiro review."

      - name: Install Kiro CLI
        if: env.KIRO_API_KEY != ''
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          # Install dir isn't documented for CI; add the common locations to PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.kiro/bin" >> "$GITHUB_PATH"

      - name: Review diff against safety.md
        if: env.KIRO_API_KEY != ''
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          kiro-cli chat --v3 --no-interactive --trust-tools=read_file,grep_search \
            "You are reviewing a pull request for Sentra, an escalate-only stroke-warning prototype. \
          Read .kiro/steering/safety.md and the diff at /tmp/pr.diff. Report any change that could: \
          show reassuring copy (banned words), hide or delay the Call 911 button, add a triage state other than \
          CALL_911_NOW / CANNOT_RULE_OUT / RETRY_CAPTURE, let poor capture quality or a baseline lower urgency, \
          hard-code a threshold outside thresholds.ts, send video/images off-device, or weaken a safety test. \
          End with exactly one line: SAFETY_REVIEW: PASS or SAFETY_REVIEW: FAIL." | tee /tmp/review.txt
          grep -q "SAFETY_REVIEW: PASS" /tmp/review.txt
